<!doctype html>
<!--
  reel-cover-template.html: 1080x1920 vertical cover frame with the hook on it.

  Needs: a copy of this file with the %%SLOTS%% filled in, cover-bg.jpg sitting
  next to it, and Playwright to screenshot it.

  Example:
    cp reel-cover-template.html cover.html
    ffmpeg -v error -y -ss 3.4 -i final.mp4 -frames:v 1 -update 1 cover-bg.jpg
    node screenshot-thumb.mjs cover.html cover-2x.png 1080 1920
    ffmpeg -y -i cover-2x.png -vf scale=1080:1920 -q:v 2 cover-instagram.jpg
    # check the profile-grid crop survives the hook:
    ffmpeg -y -i cover-instagram.jpg -vf "crop=1080:1350:0:285" -q:v 2 cover-gridcrop.jpg

  Slots: %%KICKER%%, %%HEAD_LINE1%%, %%HEAD_HIGHLIGHT%%, %%HANDLE%%
-->
<html><head><meta charset="utf-8"><style>
  /* Match the card style you composed with by changing these four values.
     clean (default): as below.
     panel:           --accent:#5CC8FF; --kicker:#B8E6FF; --on-accent:#061018;
                      --font-head:"Avenir Next Condensed","Roboto Condensed","Arial Narrow",sans-serif
     example-brand:   --accent:#8B7CF6; --kicker:#D4CCFF; --on-accent:#FFFFFF; the panel --font-head
     your own style:  copy --accent, --accent-soft (as --kicker) and --on-accent from its file. */
  :root{--accent:#0071e3;--kicker:#7fc4ff;--on-accent:#0a0a0c;
    --font-head:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1920px;overflow:hidden}
  .stage{position:relative;width:1080px;height:1920px;background:#0a0a0c;
    font-family:var(--font-head)}
  /* cover-bg.jpg must sit next to this file: a 1080x1920 frame from the finished cut. */
  .photo{position:absolute;inset:0;background-image:url('cover-bg.jpg');background-size:cover;background-position:center}
  /* Instagram crops the reel cover to a centred 4:5 for the profile grid, which on
     1080x1920 is y=285..1635. Everything that must survive the grid lives inside
     the .safe band below. Text sits above the reaction PiP, which owns y>1284. */
  .scrim{position:absolute;left:0;right:0;top:640px;height:700px;
    background:linear-gradient(180deg,rgba(6,8,12,0) 0%,rgba(6,8,12,.80) 34%,rgba(6,8,12,.94) 62%,rgba(6,8,12,.72) 100%)}
  .safe{position:absolute;left:64px;right:64px;bottom:640px}
  .kick{font-size:34px;font-weight:700;letter-spacing:.18em;color:var(--kicker);text-transform:uppercase;
    margin-bottom:24px}
  .h1{font-size:118px;font-weight:800;line-height:.92;color:#fff;letter-spacing:-.035em;text-transform:uppercase}
  .h1 .hl{display:inline-block;background:var(--accent);color:var(--on-accent);padding:4px 20px 12px;border-radius:14px;
    margin-top:16px;box-shadow:0 10px 34px color-mix(in srgb, var(--accent) 50%, transparent)}
  .handle{position:absolute;left:64px;bottom:78px;font-size:30px;font-weight:700;letter-spacing:.12em;
    text-transform:uppercase;color:#fff;opacity:.92;text-shadow:0 3px 14px rgba(0,0,0,.8)}
</style></head><body>
  <div class="stage">
    <div class="photo"></div>
    <div class="scrim"></div>
    <div class="safe">
      <!-- 2 to 5 words total. This is the hook someone reads in the grid before
           they ever press play, so it carries the same promise as the caption's
           first line. Never ship a cover that is only a video frame. -->
      <div class="kick">%%KICKER%%</div>
      <div class="h1">%%HEAD_LINE1%%<br><span class="hl">%%HEAD_HIGHLIGHT%%</span></div>
    </div>
    <div class="handle">%%HANDLE%%</div>
  </div>
</body></html>
